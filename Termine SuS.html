<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termine SuS DSB</title>
    
    <!-- Polyfills -->
    <script src="https://cdn.jsdelivr.net/npm/promise-polyfill@8/dist/polyfill.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/whatwg-fetch@3.6.2/dist/fetch.umd.min.js"></script>

    <!-- FullCalendar -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        .row {
            display: flex;
            flex-direction: row;
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
        }
        .column {
            flex: 1 1 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
            padding: 10px;
            box-sizing: border-box;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }
        .column:last-child {
            border-right: none;
        }

        h2 {
            text-align: center;
            color: #4da6ff;
            margin: 10px 0;
            font-size: 1.5em;
        }

        .calendar-wrapper {
            flex: 1 1 auto;
            overflow: hidden; /* FullCalendar handles scroll */
            min-height: 0;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2em;
            color: #4da6ff;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
            z-index: 500;
        }

        #debug-log {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            max-height: 150px;
            overflow-y: auto;
            background: rgba(255, 0, 0, 0.9);
            color: #ffffff;
            font-family: monospace;
            padding: 10px;
            display: none; 
            z-index: 1000;
            border-top: 1px solid #fff;
            font-size: 14px;
        }

        /* Design */
        .fc-theme-standard td, .fc-theme-standard th { border-color: #333; }
        .fc-list-day-cushion { 
            background-color: #333 !important; 
            padding: 4px 8px !important; /* Compact padding */
        }
        .fc-list-event:hover td { background-color: #444 !important; }
        
        /* Compact rows */
        .fc-list-event td {
            padding: 2px 8px !important;
        }

        /* Highlight today - Dark Green */
        .fc-list-day.fc-day-today,
        .fc-list-day.fc-day-today .fc-list-day-cushion {
            background-color: #1b5e20 !important; /* Dark Green background for header */
        }
        .fc-list-day.fc-day-today .fc-list-day-text,
        .fc-list-day.fc-day-today .fc-list-day-side-text {
            color: #ffffff !important; /* White text */
            font-weight: bold;
        }

        .fc-list-day.fc-day-today .fc-list-day-side-text::before {
            content: "heute: ";
        }
        
        .today-event td {
            background-color: rgba(76, 175, 80, 0.2) !important; /* Light green background */
            border-left: 6px solid #4caf50 !important; /* Thicker green border */
        }
        
        .today-event .fc-list-event-title {
            font-weight: bold;
        }

        .fc-toolbar-title { font-size: 1.8em !important; color: #4da6ff; }
        .fc-button { background-color: #444 !important; border: none !important; }
        
        .fc-list-event-title { font-size: 1.1em; cursor: default; line-height: 1.2; }
        .fc-list-event-time { font-size: 1.0em; color: #cccccc !important; font-weight: normal; }
        .fc-list-empty { background-color: #121212; color: #888; font-size: 1.2em; }
        
        /* Weekend Styling */
        .fc-list-day.fc-day-sat .fc-list-day-cushion,
        .fc-list-day.fc-day-sun .fc-list-day-cushion {
            background-color: #1a237e !important; /* Dark Blue for Weekend */
        }

        /* Past Events */
        .past-event {
            opacity: 0.5;
        }

        /* Spacing between days */
        .fc-list-day th {
            border-top: 10px solid #121212 !important;
        }
        
        /* Hide toolbar since we have custom headers */
        .fc-header-toolbar { display: none !important; }

        /* Hide scrollbars */
        .fc-scroller {
            overflow-y: hidden !important; /* Try to avoid scrollbars initially */
        }

        /* Ordnungsdienst Box */
        .ordnungsdienst-box {
    background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%);
    border: 2px solid #4caf50;
    border-radius: 10px;
    padding: 8px 18px;
    margin: 8px 10px 12px 10px;
    box-shadow: 0 2px 8px rgba(76, 175, 80, 0.18);
    text-align: center;
    font-size: 1.4em;
    color: #ffffff;
    min-height: unset;
    height: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
        }

        .ordnungsdienst-box .title {
    font-weight: bold;
    margin-bottom: 0;
    margin-right: 12px;
    color: #fff;
    font-size: 1.4em; /* match students text size */
    display: inline;
        }

        .ordnungsdienst-box .class-name {
            color: #ffc107;
            font-weight: bold;
        }
        .ordnungsdienst-box .students {
            font-size: 1.4em;
        }
    </style>
</head>
<body>


    <div id='loading'>Lade Kalender...</div>

    <div class="container">
        <div class="row">
            <div class="column">
                <h2>Diese Woche</h2>
                <div id="calendar-this-week" class="calendar-wrapper"></div>
            </div>
            <div class="column">
                <h2>Nächste Woche</h2>
                <div id="calendar-next-week" class="calendar-wrapper"></div>
            </div>
        </div>
        <div id="ordnungsdienst-box" class="ordnungsdienst-box" style="display: none;">
            <!-- Wird dynamisch gefüllt -->
        </div>
    </div>

    <div id='debug-log'></div>

    <script>
        function logError(msg, err) {
            console.error(msg, err);
            // Bewusst nur in der Browser-Konsole sichtbar, nicht auf dem Bildschirm –
            // die rote Debug-Box bleibt für den Normalbetrieb ausgeblendet.
            var logEl = document.getElementById('debug-log');
            var errText = err ? (err.message || err.toString()) : '';
            logEl.innerHTML += '<div><strong>' + msg + '</strong> ' + errText + '</div>';
        }

        // Fängt fehlgeschlagene <script src="..."> Ladevorgänge ab (z.B. wenn
        // die Schul-Firewall cdn.jsdelivr.net blockiert). Ohne diesen Handler
        // bleibt die Seite stumm bei "Lade Kalender..." hängen, weil
        // FullCalendar dann undefined ist und der restliche Code nie läuft.
        window.addEventListener('error', function(e) {
            var target = e.target;
            if (target && target.tagName === 'SCRIPT') {
                logError('SCRIPT-FEHLER', 'Konnte nicht geladen werden: ' + target.src + ' (evtl. durch Schul-Firewall/Proxy blockiert)');
                var loadingEl = document.getElementById('loading');
                if (loadingEl) {
                    loadingEl.innerHTML = '⚠ Bibliothek konnte nicht geladen werden.<br><small>' + target.src + '</small>';
                }
            }
        }, true);

        // Öffentliche Google-Kalender werden direkt über die Google Calendar API (JSON, v3)
        // abgerufen. Google liefert dort saubere CORS-Header (Access-Control-Allow-Origin: *),
        // d.h. es wird KEIN Proxy/Worker mehr benötigt. googleapis.com wird von Schul-Firewalls
        // praktisch nie blockiert (im Gegensatz zu workers.dev, corsproxy.io etc.).
        //
        // API-Key hier eintragen (siehe Anleitung): Google Cloud Console -> Projekt anlegen ->
        // "Google Calendar API" aktivieren -> Anmeldedaten -> API-Schlüssel erstellen ->
        // auf die eigene Domain (HTTP-Verweis-URLs) einschränken.
        var GOOGLE_API_KEY = 'AIzaSyC4LmJ33nQi_dQHCCmotkK04_rEyJWOBCY';

        var calendarConfigs = [
            { id: 'dr23bb74v8vvnpn2sgmnrhdn4g@group.calendar.google.com', color: '#3f51b5' },
            { id: '5a5mb1jceu56dhb023cctdcmt8@group.calendar.google.com', color: '#c0ca33' }
        ];

        // Holt eine URL mit Timeout, damit ein "hängender" Request nicht den gesamten
        // Ladevorgang für immer blockiert. Bewusst OHNE AbortController gebaut: das
        // DSB-Anzeigegerät nutzt eine alte Browser-Engine, die diese API nicht kennt
        // (daher auch die fetch/Promise-Polyfills oben).
        function fetchWithTimeout(url, timeoutMs) {
            return new Promise(function(resolve, reject) {
                var settled = false;
                var timer = setTimeout(function() {
                    if (settled) return;
                    settled = true;
                    reject(new Error('Timeout nach ' + timeoutMs + 'ms'));
                }, timeoutMs);

                fetch(url).then(function(res) {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    resolve(res);
                }).catch(function(err) {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    reject(err);
                });
            });
        }

        function fetchCalendarEvents(calendarId, rangeStart, rangeEnd) {
            var url = 'https://www.googleapis.com/calendar/v3/calendars/'
                + encodeURIComponent(calendarId)
                + '/events?key=' + encodeURIComponent(GOOGLE_API_KEY)
                + '&timeMin=' + encodeURIComponent(rangeStart.toISOString())
                + '&timeMax=' + encodeURIComponent(rangeEnd.toISOString())
                + '&singleEvents=true&orderBy=startTime&maxResults=2500';

            return fetchWithTimeout(url, 10000).then(function(res) {
                if (!res.ok) {
                    return res.text().then(function(body) {
                        throw new Error('HTTP ' + res.status + ' – ' + body.substring(0, 200));
                    });
                }
                return res.json();
            });
        }

        // Globaler Cache für die Events
        var cachedEvents = null;

        function fitContent() {
            var cal1El = document.getElementById('calendar-this-week');
            var cal2El = document.getElementById('calendar-next-week');
            
            // Start mit maximaler Schriftgröße (28px wie gewünscht)
            var fontSize = 28; 
            cal1El.style.fontSize = fontSize + 'px';
            cal2El.style.fontSize = fontSize + 'px';
            
            // Wenn Inhalt größer als Container, Schrift verkleinern (synchron für beide)
            requestAnimationFrame(function() {
                var scroller1 = cal1El.querySelector('.fc-scroller');
                var scroller2 = cal2El.querySelector('.fc-scroller');
                
                if (!scroller1 || !scroller2) return;

                // Solange EINER der beiden zu groß ist, verkleinern wir BEIDE
                while ((scroller1.scrollHeight > scroller1.clientHeight || 
                        scroller2.scrollHeight > scroller2.clientHeight) && 
                       fontSize > 8) {
                    fontSize -= 1;
                    cal1El.style.fontSize = fontSize + 'px';
                    cal2El.style.fontSize = fontSize + 'px';
                }
            });
        }

        function loadAllEvents() {
            if (cachedEvents) return Promise.resolve(cachedEvents);

            // Events für einen großen Zeitraum laden (-1 Monat bis +3 Monate)
            var now = new Date();
            var rangeStart = new Date(now);
            rangeStart.setMonth(rangeStart.getMonth() - 1);
            var rangeEnd = new Date(now);
            rangeEnd.setMonth(rangeEnd.getMonth() + 3);

            var promises = calendarConfigs.map(function(cfg, index) {
                document.getElementById('loading').innerText = 'Lade Kalender ' + (index + 1) + '...';
                logError('DEBUG', 'Lade Kalender ' + (index + 1) + ' via Google Calendar API...');

                return fetchCalendarEvents(cfg.id, rangeStart, rangeEnd)
                    .then(function(data) {
                        var items = data.items || [];
                        console.log('Kalender ' + (index+1) + ': ' + items.length + ' Events');
                        logError('SUCCESS', 'Kalender ' + (index+1) + ': ' + items.length + ' Events geladen');
                        return { status: 'fulfilled', items: items, color: cfg.color };
                    })
                    .catch(function(err) {
                        var reason = err && err.message;
                        console.error('Fehler beim Laden Kalender ' + (index+1) + ':', reason);
                        logError('ERROR', 'Kalender ' + (index+1) + ' fehlgeschlagen: ' + reason);
                        return { status: 'rejected', reason: err };
                    });
            });

            return Promise.all(promises).then(function(results) {
                if (results.every(function(r) { return r.status === 'rejected'; })) {
                    // Kein einziger Kalender konnte geladen werden -> nach oben durchreichen,
                    // damit eine sichtbare Fehlermeldung statt eines leeren "keine Termine" erscheint.
                    throw new Error('Kein Kalender konnte geladen werden');
                }

                var allEvents = [];

                results.forEach(function(result) {
                    if (result.status === 'rejected') return;

                    result.items.forEach(function(item) {
                        if (!item.start) return;
                        var isAllDay = !!item.start.date;
                        var start = isAllDay
                            ? new Date(item.start.date + 'T00:00:00')
                            : new Date(item.start.dateTime);

                        allEvents.push({
                            title: item.summary || '(ohne Titel)',
                            start: start,
                            allDay: isAllDay,
                            color: result.color
                        });
                    });
                });

                console.log('Total Events vor Deduplizierung: ' + allEvents.length);
                logError('DEBUG', 'Total Events vor Deduplizierung: ' + allEvents.length);

                // Duplikate entfernen
                // Wir filtern Events, die am gleichen Tag den gleichen Titel haben
                var uniqueEvents = [];
                var seen = new Set();

                allEvents.forEach(function(ev) {
                    // Erstelle einen eindeutigen Schlüssel aus Datum und Titel
                    var d = ev.start;
                    var dateStr = d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
                    var key = dateStr + '|' + ev.title;

                    if (!seen.has(key)) {
                        seen.add(key);
                        uniqueEvents.push(ev);
                    }
                });

                console.log('Final Events nach Deduplizierung: ' + uniqueEvents.length);
                logError('SUCCESS', 'Final Events: ' + uniqueEvents.length);

                cachedEvents = uniqueEvents;
                return uniqueEvents;
            });
        }

        // === ORDNUNGSDIENST LOGIK ===
        var csvData = "Vorname,Familienname,Klasse";

        function parseCSV(text) {
            var lines = text.split('\n').filter(function(line) { return line.trim(); });
            var classMap = {};
            for (var i = 1; i < lines.length; i++) {
                var values = lines[i].split(',').map(function(v) { return v.trim(); });
                if (values.length >= 3) {
                    var vorname = values[0];
                    var familienname = values[1];
                    var klasse = values[2];
                    var fullName = vorname + ' ' + familienname;
                    if (!classMap[klasse]) {
                        classMap[klasse] = [];
                    }
                    classMap[klasse].push(fullName);
                }
            }
            return classMap;
        }

        function getMonday(date) {
            var d = new Date(date);
            var day = d.getDay();
            var diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        function extractClassFromTitle(title, classMap) {
            if (!title) return null;

            var normalizedTitle = title.replace(/\\,/g, ',');
            var regexMatch = normalizedTitle.match(/\b(\d{1,2}\s?[A-Za-z])\b/);

            if (regexMatch) {
                var candidate = regexMatch[1].replace(/\s+/g, '').toUpperCase();
                if (!classMap || classMap[candidate]) {
                    return candidate;
                }
            }

            if (classMap) {
                var upperTitle = normalizedTitle.toUpperCase();
                var classNames = Object.keys(classMap);
                for (var i = 0; i < classNames.length; i++) {
                    if (upperTitle.indexOf(classNames[i].toUpperCase()) !== -1) {
                        return classNames[i];
                    }
                }
            }

            return null;
        }

        function resolveClassForStudents(className, classMap) {
            if (!className || !classMap) return null;
            if (classMap[className]) return className;

            var m = className.match(/^(\d{1,2})[A-Z]$/);
            if (m) {
                var zClass = m[1] + 'Z';
                if (classMap[zClass]) return zClass;
            }

            return null;
        }

        function displayTodayOrdnungsdienst(events) {
            var classMap = parseCSV(csvData);
            var today = new Date();
            today.setHours(0, 0, 0, 0);
            var dayOfWeek = today.getDay();
            
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                return;
            }
            
            var studentRotation = {};
            Object.keys(classMap).forEach(function(className) {
                studentRotation[className] = 20;
            });

            var todayOrdnung = null;
            var missingClassForToday = null;
            var days = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
            var todayName = days[dayOfWeek];
            
            events.forEach(function(event) {
                if (event.title.toLowerCase().indexOf('ordnungsdienst') !== -1) {
                    var monday = getMonday(event.start);
                    monday.setHours(0, 0, 0, 0);
                    var friday = new Date(monday);
                    friday.setDate(friday.getDate() + 4);
                    friday.setHours(23, 59, 59, 999);
                    
                    // Nur wenn dieses Event diese Woche ist, dann verarbeiten
                    if (today >= monday && today <= friday) {
                        var className = extractClassFromTitle(event.title, classMap);
                        if (className) {
                            var resolvedClass = resolveClassForStudents(className, classMap);
                            
                            if (resolvedClass) {
                                var dayIndex = dayOfWeek - 1;
                                var startIndex = studentRotation[resolvedClass];
                                var todayStudents = [];
                                
                                for (var i = 0; i < 4; i++) {
                                    var studentIndex = (startIndex + dayIndex * 4 + i) % classMap[resolvedClass].length;
                                    todayStudents.push(classMap[resolvedClass][studentIndex]);
                                }
                                
                                todayOrdnung = {
                                    day: todayName,
                                    date: today.getDate() + '.' + (today.getMonth() + 1) + '.',
                                    class: resolvedClass,
                                    calendarClass: className !== resolvedClass ? className : null,
                                    students: todayStudents
                                };
                            } else {
                                missingClassForToday = className;
                            }
                        }
                    }
                }
            });
            
            var boxEl = document.getElementById('ordnungsdienst-box');
            var todayDateStr = today.getDate() + '.' + (today.getMonth() + 1) + '.' + today.getFullYear();
            var html = '<div class="title">📋 Ordnungsdienst ' + todayName + ', ' + todayDateStr + ':</div>';
            
            if (todayOrdnung) {
                html += '<span class="class-name">' + todayOrdnung.class + '</span> - ';
                if (todayOrdnung.calendarClass) {
                    html += '<span style="opacity:0.9;">(Kalender: ' + todayOrdnung.calendarClass + ')</span> - ';
                }
                html += '<span class="students">' + todayOrdnung.students.join(', ') + '</span>';
            } else if (missingClassForToday) {
                html += '<span class="class-name">' + missingClassForToday + '</span> - Schülerliste für diese Klasse fehlt in der Datei';
            } else {
                html += 'Keine Daten für diese Woche vorhanden';
            }
            
            boxEl.innerHTML = html;
            boxEl.style.display = 'block';
        }

        document.addEventListener('DOMContentLoaded', function() {
            var loadingEl = document.getElementById('loading');

            if (typeof FullCalendar === 'undefined') {
                loadingEl.innerHTML = '⚠ Kalender-Bibliothek (cdn.jsdelivr.net) konnte nicht geladen werden.<br><small>Bitte cdn.jsdelivr.net in der Schul-Firewall freigeben.</small>';
                logError('FATAL', 'FullCalendar ist undefined – CDN vermutlich blockiert.');
                return;
            }

            if (!GOOGLE_API_KEY || GOOGLE_API_KEY === 'DEIN_API_KEY_HIER') {
                loadingEl.innerHTML = '⚠ Kein Google-API-Key eingetragen.<br><small>Siehe Kommentar bei GOOGLE_API_KEY im Code.</small>';
                logError('FATAL', 'GOOGLE_API_KEY ist nicht gesetzt.');
                return;
            }

            try {
            // Datum berechnen
            var today = new Date();
            today.setHours(0,0,0,0);
            
            // Nächster Montag berechnen
            var day = today.getDay(); // 0=Sun, 1=Mon
            var diffToNextMonday = (8 - day) % 7;
            if (diffToNextMonday === 0) diffToNextMonday = 7; 
            
            var nextMonday = new Date(today);
            nextMonday.setDate(today.getDate() + diffToNextMonday);
            
            // Montag danach (für das Ende der 2. Woche)
            var nextNextMonday = new Date(nextMonday);
            nextNextMonday.setDate(nextMonday.getDate() + 7);

            // Helper to format date
            function formatDate(d) {
                return d.getDate() + '.' + (d.getMonth()+1) + '.';
            }

            // Calculate end dates for display (Sunday)
            var sundayThisWeek = new Date(nextMonday);
            sundayThisWeek.setDate(sundayThisWeek.getDate() - 1);

            var sundayNextWeek = new Date(nextNextMonday);
            sundayNextWeek.setDate(sundayNextWeek.getDate() - 1);

            // Update Headers (robust: finde die ersten beiden .column unabhängig von der Ordnungsdienst-Box)
            var columns = document.querySelectorAll('.container > .column');
            if (columns.length >= 2) {
                var h2_1 = columns[0].querySelector('h2');
                var h2_2 = columns[1].querySelector('h2');
                if (h2_1) h2_1.innerText = 'Diese Woche (' + formatDate(today) + ' - ' + formatDate(sundayThisWeek) + ')';
                if (h2_2) h2_2.innerText = 'Nächste Woche (' + formatDate(nextMonday) + ' - ' + formatDate(sundayNextWeek) + ')';
            }

            // Kalender 1: Diese Woche (ab heute bis Sonntag)
            var cal1El = document.getElementById('calendar-this-week');
            var cal1 = new FullCalendar.Calendar(cal1El, {
                initialView: 'listYear', // WICHTIG: listYear zeigt alle Events im validRange an
                locale: 'de',
                headerToolbar: false,
                height: '100%',
                noEventsContent: 'Heute keine Termine mehr 😊',
                validRange: {
                    start: today,
                    end: nextMonday
                },
                eventClassNames: function(arg) {
                    var classes = [];
                    var d = arg.event.start;
                    var now = new Date();
                    
                    // Today check
                    if (d.getDate() === now.getDate() && 
                        d.getMonth() === now.getMonth() && 
                        d.getFullYear() === now.getFullYear()) {
                        classes.push('today-event');
                        
                        // Past check (only for today)
                        if (d < now) {
                            classes.push('past-event');
                        }
                    }
                    return classes;
                },
                events: function(info, success, failure) {
                    loadAllEvents().then(function(events) {
                        success(events);
                    }).catch(failure);
                },
                eventsSet: function() {
                    fitContent();
                },
                windowResize: function() {
                    fitContent();
                }
            });

            // Kalender 2: Nächste Woche (Montag bis Sonntag)
            var cal2El = document.getElementById('calendar-next-week');
            var cal2 = new FullCalendar.Calendar(cal2El, {
                initialView: 'listYear', // WICHTIG: listYear zeigt alle Events im validRange an
                locale: 'de',
                headerToolbar: false,
                height: '100%',
                noEventsContent: 'Heute keine Termine mehr 😊',
                validRange: {
                    start: nextMonday,
                    end: nextNextMonday
                },
                eventClassNames: function(arg) {
                    var classes = [];
                    var d = arg.event.start;
                    var now = new Date();
                    
                    // Today check
                    if (d.getDate() === now.getDate() && 
                        d.getMonth() === now.getMonth() && 
                        d.getFullYear() === now.getFullYear()) {
                        classes.push('today-event');
                        
                        // Past check (only for today)
                        if (d < now) {
                            classes.push('past-event');
                        }
                    }
                    return classes;
                },
                events: function(info, success, failure) {
                    loadAllEvents().then(function(events) {
                        success(events);
                    }).catch(failure);
                },
                eventsSet: function() {
                    fitContent();
                },
                windowResize: function() {
                    fitContent();
                }
            });

            loadingEl.style.display = 'block';

            function showLoadFailure(err) {
                logError("Fehler beim Laden:", err);
                loadingEl.innerHTML = '⚠ Kalenderdaten konnten nicht geladen werden.<br><small>Proxy/Netzwerk vermutlich durch Schul-Firewall blockiert. Details unten.</small>';
                loadingEl.style.display = 'block';
            }

            // Funktion zum Laden und Aktualisieren der Daten
            function refreshCalendarData() {
                // Cache leeren für frische Daten
                cachedEvents = null;

                loadAllEvents().then(function(events) {
                    loadingEl.style.display = 'none';
                    // Kalender mit neuen Events aktualisieren
                    cal1.refetchEvents();
                    cal2.refetchEvents();
                    displayTodayOrdnungsdienst(events);
                }).catch(showLoadFailure);
            }

            // Erst Daten laden, dann rendern
            loadAllEvents().then(function(events) {
                loadingEl.style.display = 'none';
                cal1.render();
                cal2.render();
                displayTodayOrdnungsdienst(events);
            }).catch(showLoadFailure);

            // Auto-Refresh alle 5 Minuten (300000 ms)
            setInterval(refreshCalendarData, 300000);
            } catch (fatalErr) {
                logError('FATAL beim Initialisieren', fatalErr);
                loadingEl.innerHTML = '⚠ Fehler beim Initialisieren.<br><small>' + (fatalErr && fatalErr.message ? fatalErr.message : fatalErr) + '</small>';
            }
        });
    </script>
</body>
</html>
